<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>ShaderFlow · 玩家</title><link rel="stylesheet" href="../style.css"></head>
<body><div id="notices" aria-live="polite"></div>
<header><div><h1>ShaderFlow · 玩家端</h1><p id="identity" class="hint">正在确认外部登录…</p></div><span id="socket" class="hint">未连接</span></header>
<main><section class="panel"><div class="row"><strong id="status">等待服务器状态</strong><span id="tileInfo" class="hint"></span></div><p class="hint">你的代码会先作为候选版本发送；只有管理大屏用锁定模板完成 WebGPU 编译和绘制后，才会显示在现场画面中。</p></section>
<div class="layout"><section class="panel stack"><h2>可编辑部分</h2><p class="hint">只能修改两个颜色常量和 <code>userfn</code>。x/y 范围均为 0～1，t 为帧时间。</p><textarea id="editor" class="editor" spellcheck="false" rows="25"></textarea><div class="row"><button id="submit">本地验证并提交候选</button><button id="reset" class="secondary">恢复模板</button><span id="version" class="hint"></span></div><pre id="errors" class="bad"></pre></section><section class="panel"><h2>本地预览</h2><canvas id="preview" class="player-preview"></canvas></section></div></main>
<script type="module" src="./app.js"></script></body></html>
